<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <meta name="description" content="Онлайн 3D-конструктор шкафов и кухонь: деталировка для цеха, смета, КП в PDF, AR и фото-рендер." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>3D-конструктор мебели — Mebel3D</title>
  </head>
  <body class="app-body">
    <a class="skip" href="#viewport">К 3D-сцене</a>
    <div id="app" class="app" data-tab="3d">
      <header class="top">
        <a class="brand" href="/" aria-label="Mebel3D — на главную">
          <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><use href="/favicon.svg#logo" /></svg>
          <span>Mebel3D</span>
        </a>
        <label class="pname"><span class="sr">Название проекта</span>
          <input id="proj-name" type="text" maxlength="80" autocomplete="off" spellcheck="false" placeholder="Название проекта" />
        </label>
        <div class="price-chip" aria-live="polite"><small>Итого</small><b id="price">0 ₸</b></div>
        <div id="actions" class="actions" role="toolbar" aria-label="Действия"></div>
      </header>

      <aside id="left" class="panel left" aria-label="Модули"></aside>

      <main class="stage" id="stage">
        <div id="viewport" class="viewport" tabindex="-1"></div>
        <div id="viewtools" class="viewtools" role="toolbar" aria-label="Виды"></div>
        <div id="hud" class="hud" aria-live="polite"></div>
      </main>

      <aside id="right" class="panel right" aria-label="Параметры модуля"></aside>

      <nav id="tabbar" class="tabbar" aria-label="Разделы"></nav>
    </div>

    <div id="toasts" aria-live="polite"></div>
    <div id="print-root" aria-hidden="true"></div>
    <noscript><p style="padding:2rem">Для работы конструктора включите JavaScript.</p></noscript>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
